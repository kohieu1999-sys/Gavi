
name: Build Gavi Store IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find project
        run: |
          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Project not found"
            find . -maxdepth 5 -type d
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build app
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Gavi-Store-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gavi-Store-IPA
          path: Gavi-Store-unsigned.ipa
